<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Everyday examples of artificial intelligence</title>
  <desc id="desc">Five examples show AI recognizing speech, identifying objects in photos, recommending routes, translating language, and finding patterns. A final panel explains that generative AI creates new text, images, and audio.</desc>
  <rect width="1400" height="820" rx="30" fill="#f7fbfc"/>
  <text x="700" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1f2a44">AI works with patterns</text>
  <text x="700" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#526078">You already encounter different kinds of AI in everyday life.</text>

  <g font-family="Arial, sans-serif">
    <rect x="55" y="155" width="238" height="260" rx="24" fill="#ffffff" stroke="#2e8fb8" stroke-width="4"/>
    <circle cx="174" cy="220" r="42" fill="#e7f3fa"/>
    <path d="M149 221h18l22-18v36l-22-18h-18z" fill="#2368a8"/>
    <path d="M199 210q18 12 0 24M209 201q31 21 0 42" fill="none" stroke="#2368a8" stroke-width="5" stroke-linecap="round"/>
    <text x="174" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2a44">Recognize speech</text>
    <text x="174" y="333" text-anchor="middle" font-size="20" fill="#526078">Spoken words</text>
    <text x="174" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#e94b16">↓</text>
    <text x="174" y="397" text-anchor="middle" font-size="20" fill="#526078">Written captions</text>

    <rect x="318" y="155" width="238" height="260" rx="24" fill="#ffffff" stroke="#2bae9e" stroke-width="4"/>
    <circle cx="437" cy="220" r="42" fill="#e6f8f4"/>
    <rect x="409" y="197" width="56" height="46" rx="6" fill="none" stroke="#178a7e" stroke-width="5"/>
    <circle cx="449" cy="209" r="6" fill="#178a7e"/>
    <path d="M414 237l15-15 10 9 9-8 12 14" fill="none" stroke="#178a7e" stroke-width="5" stroke-linejoin="round"/>
    <text x="437" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2a44">Identify objects</text>
    <text x="437" y="333" text-anchor="middle" font-size="20" fill="#526078">A photograph</text>
    <text x="437" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#e94b16">↓</text>
    <text x="437" y="397" text-anchor="middle" font-size="20" fill="#526078">“Dog, tree, car”</text>

    <rect x="581" y="155" width="238" height="260" rx="24" fill="#ffffff" stroke="#2368a8" stroke-width="4"/>
    <circle cx="700" cy="220" r="42" fill="#e9f0fb"/>
    <path d="M675 239c9-20 9-38 25-38 17 0 17 18 25 38" fill="none" stroke="#2368a8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="675" cy="239" r="7" fill="#e94b16"/><circle cx="725" cy="239" r="7" fill="#2bae9e"/>
    <text x="700" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2a44">Recommend a route</text>
    <text x="700" y="333" text-anchor="middle" font-size="20" fill="#526078">Your destination</text>
    <text x="700" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#e94b16">↓</text>
    <text x="700" y="397" text-anchor="middle" font-size="20" fill="#526078">A suggested path</text>

    <rect x="844" y="155" width="238" height="260" rx="24" fill="#ffffff" stroke="#2bae9e" stroke-width="4"/>
    <circle cx="963" cy="220" r="42" fill="#e6f8f4"/>
    <text x="945" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#178a7e">A</text>
    <text x="980" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#2368a8">文</text>
    <text x="963" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2a44">Translate</text>
    <text x="963" y="333" text-anchor="middle" font-size="20" fill="#526078">One language</text>
    <text x="963" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#e94b16">↓</text>
    <text x="963" y="397" text-anchor="middle" font-size="20" fill="#526078">Another language</text>

    <rect x="1107" y="155" width="238" height="260" rx="24" fill="#ffffff" stroke="#2e8fb8" stroke-width="4"/>
    <circle cx="1226" cy="220" r="42" fill="#e7f3fa"/>
    <circle cx="1206" cy="220" r="8" fill="#2368a8"/><circle cx="1226" cy="202" r="8" fill="#2bae9e"/><circle cx="1246" cy="220" r="8" fill="#e94b16"/><circle cx="1226" cy="239" r="8" fill="#2368a8"/>
    <path d="M1212 215l9-8m11 0l9 8m-9 10l9-2m-29 0l9 2" stroke="#526078" stroke-width="4"/>
    <text x="1226" y="294" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2a44">Find patterns</text>
    <text x="1226" y="333" text-anchor="middle" font-size="20" fill="#526078">Many examples</text>
    <text x="1226" y="365" text-anchor="middle" font-size="26" font-weight="700" fill="#e94b16">↓</text>
    <text x="1226" y="397" text-anchor="middle" font-size="20" fill="#526078">Useful groupings</text>
  </g>

  <path d="M174 450H1226" stroke="#b9ccd4" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 450v54" stroke="#b9ccd4" stroke-width="4"/>
  <rect x="190" y="505" width="1020" height="235" rx="28" fill="#e6f8f4" stroke="#2bae9e" stroke-width="5"/>
  <text x="700" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#178a7e">GENERATIVE AI</text>
  <text x="700" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2a44">Uses learned patterns to create something new</text>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2a44">
    <rect x="310" y="655" width="210" height="52" rx="26" fill="#ffffff"/><text x="415" y="689" text-anchor="middle">Text</text>
    <rect x="595" y="655" width="210" height="52" rx="26" fill="#ffffff"/><text x="700" y="689" text-anchor="middle">Images</text>
    <rect x="880" y="655" width="210" height="52" rx="26" fill="#ffffff"/><text x="985" y="689" text-anchor="middle">Audio</text>
  </g>
  <text x="700" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3e13">Helpful does not always mean correct. People still need to review important results.</text>
</svg>
