<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Arizona's Colorado River water: who uses how much</title>
  <desc id="desc">Bar chart showing that agriculture uses about 72 percent of Arizona's Colorado River water, all other uses combined including cities and industry make up about 28 percent, and AI data centers use an estimated 1,841 of the 1.9 million acre-feet drawn each year, well under one tenth of one percent.</desc>
  <rect width="1200" height="680" rx="30" fill="#f7fbfc"/>
  <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2a44">Who uses Arizona's Colorado River water</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#526078">Share of the roughly 1.9 million acre-feet drawn each year</text>

  <g font-family="Arial, sans-serif">
    <!-- Agriculture bar -->
    <text x="80" y="180" font-size="22" font-weight="700" fill="#1f2a44">Agriculture</text>
    <rect x="80" y="196" width="1000" height="56" rx="10" fill="#e9f2fa"/>
    <rect x="80" y="196" width="720" height="56" rx="10" fill="#2368a8"/>
    <text x="820" y="234" font-size="26" font-weight="700" fill="#174d7e">72%</text>

    <!-- All other uses bar -->
    <text x="80" y="300" font-size="22" font-weight="700" fill="#1f2a44">Cities, industry, and everything else</text>
    <rect x="80" y="316" width="1000" height="56" rx="10" fill="#e6f8f4"/>
    <rect x="80" y="316" width="280" height="56" rx="10" fill="#2bae9e"/>
    <text x="380" y="354" font-size="26" font-weight="700" fill="#187b71">28%</text>

    <!-- AI data centers callout -->
    <text x="80" y="420" font-size="22" font-weight="700" fill="#1f2a44">AI data centers (part of the slice above)</text>
    <rect x="80" y="436" width="1000" height="56" rx="10" fill="#fdeadf"/>
    <rect x="80" y="436" width="4" height="56" rx="2" fill="#e54f1b"/>
    <text x="100" y="474" font-size="22" font-weight="700" fill="#bd3d12">Well under 0.1%</text>

    <rect x="80" y="530" width="1000" height="110" rx="18" fill="#ffffff" stroke="#d7e1e5" stroke-width="3"/>
    <text x="110" y="566" font-size="20" fill="#1f2a44" font-weight="700">The honest complication</text>
    <text x="110" y="596" font-size="19" fill="#4a5570">Arizona data centers use an estimated 1,841 acre-feet a year directly, against a state</text>
    <text x="110" y="622" font-size="19" fill="#4a5570">total of about 1.9 million. That slice is small today, but it is growing fast and is not tracked well.</text>
  </g>
</svg>
